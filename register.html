<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Registration - Library Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Theme CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 520px;">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h1 class="auth-title">Create Staff Account</h1>
      <p class="auth-subtitle">Register a new administrator or library operator</p>
    </div>

    <div class="auth-body">
      <div id="register-alert" class="alert alert-danger py-2 mb-3 d-none" role="alert"></div>

      <form id="register-form">
        <div class="row g-2">
          <div class="col-md-6 mb-3">
            <label for="fullName" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" placeholder="e.g. jdoe" required minlength="3">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="name@library.edu" required>
        </div>

        <div class="row g-2">
          <div class="col-md-6 mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Min. 6 chars" required minlength="6">
          </div>
          <div class="col-md-6 mb-3">
            <label for="role" class="form-label fw-semibold">Role</label>
            <select class="form-select" id="role">
              <option value="ADMIN">Administrator</option>
              <option value="LIBRARIAN">Librarian</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="btn-submit-register">
          <span class="spinner-border spinner-border-sm me-2 d-none" id="register-spinner"></span>
          <i class="bi bi-check2-circle me-1"></i> Register Account
        </button>
      </form>

      <div class="text-center mt-3 pt-2 border-top">
        <span class="text-muted small">Already have an account?</span>
        <a href="login.html" class="small fw-semibold ms-1 text-decoration-none">Sign In Here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      const alertBox = document.getElementById("register-alert");
      const submitBtn = document.getElementById("btn-submit-register");
      const spinner = document.getElementById("register-spinner");

      alertBox.classList.add("d-none");
      submitBtn.disabled = true;
      spinner.classList.remove("d-none");

      try {
        const response = await api.post("/auth/register", {
          fullName,
          username,
          email,
          password,
          role
        });

        if (response && response.success) {
          showToast("success", "Account Created", "Registration successful! You can now log in.");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 800);
        } else {
          throw new Error(response.message || "Registration failed");
        }
      } catch (error) {
        alertBox.textContent = error.message;
        alertBox.classList.remove("d-none");
        submitBtn.disabled = false;
        spinner.classList.add("d-none");
      }
    });
  </script>
</body>
</html>
